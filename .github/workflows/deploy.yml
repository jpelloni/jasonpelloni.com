name: Deploy to S3

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  DIST_DIR: dist/apps/web

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      # Old hashed assets are kept (no --delete) so visitors holding a
      # previous index.html can still load its chunks mid-deploy.
      - name: Sync hashed assets (long cache)
        run: |
          aws s3 sync "$DIST_DIR" "s3://${{ secrets.S3_BUCKET_NAME }}" \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "*" \
            --include "assets/*"

      - name: Sync remaining files (no cache)
        run: |
          aws s3 sync "$DIST_DIR" "s3://${{ secrets.S3_BUCKET_NAME }}" \
            --delete \
            --cache-control "public,max-age=0,must-revalidate" \
            --exclude "assets/*"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
